name: Release do Jarvis

# Para publicar uma versão: suba "version" em !Jarvis3d/desktop/package.json (ex.: 0.2.1), faça commit e crie a tag igual com "v" na frente:
#   git tag v0.2.1 && git push origin v0.2.1
# O GitHub gera o instalador (JarvisSetup-X.exe), o latest.yml e o .blockmap e publica tudo numa Release.
# É isso que o Jarvis instalado consulta para se atualizar sozinho.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    # Os testes que não precisam de chaves, câmera nem modelos: se algum falhar, NENHUMA release é publicada.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: '!Jarvis3d'
    env:
      JARVIS_HOME: ${{ runner.temp }}\\jarvis-teste
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        run: python -m pip install -r empacotar/requirements-lock.txt
      - name: Testes de Python
        shell: pwsh
        run: |
          $falhas = @()
          foreach ($t in 'teste_intencoes','teste_politica','teste_roteador','teste_terminal','teste_proativo','teste_mouse_ar','teste_mcp','teste_fim_texto') {
            python -X utf8 "scripts/$t.py"
            if ($LASTEXITCODE -ne 0) { $falhas += $t }
          }
          if ($falhas.Count) { Write-Error ("Falharam: " + ($falhas -join ', ')); exit 1 }
      - name: Testes de JavaScript (gestos e interrupção)
        run: |
          node scripts/teste_gestos.js
          node scripts/teste_interrupcao.js

  windows:
    needs: testes
    runs-on: windows-latest
    defaults:
      run:
        working-directory: '!Jarvis3d'
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que a tag bate com a versão do package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "A tag ${{ github.ref_name }} não bate com a versão $v do package.json"; exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências do servidor (versões travadas) e PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r empacotar/requirements-lock.txt
          python -m pip install pyinstaller

      - name: Empacotar o servidor Python
        run: python -m PyInstaller empacotar/jarvis-server.spec --noconfirm --distpath dist-server --workpath build-server

      - name: Dependências da casca Electron
        working-directory: '!Jarvis3d/desktop'
        run: npm ci

      - name: Criar a Release da tag (uma só; o electron-builder só anexa os arquivos)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "Jarvis ${{ github.ref_name }}" --notes "Instalador do Jarvis ${{ github.ref_name }}. Quem já tem o Jarvis instalado recebe esta versão sozinho." }

      - name: Gerar o instalador e publicar na Release
        working-directory: '!Jarvis3d/desktop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
