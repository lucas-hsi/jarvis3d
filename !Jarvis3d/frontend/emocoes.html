<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jarvis · Emoções da voz</title>
<style>
  :root { --bg:#05080c; --card:#0b131b; --linha:#16303f; --ciano:#4fd8ff; --txt:#cfeaf5; --mudo:#7a9aa8; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 "Segoe UI", system-ui, sans-serif; padding:32px; max-width:820px; margin-inline:auto; }
  h1 { font-size:22px; letter-spacing:.14em; color:var(--ciano); margin:0 0 4px; } p.sub { color:var(--mudo); margin:0 0 20px; }
  .item { display:grid; grid-template-columns:130px 150px 1fr; gap:12px; align-items:center; padding:10px 14px; background:var(--card); border:1px solid var(--linha); border-radius:10px; margin-bottom:8px; }
  .item b { color:var(--ciano); text-transform:capitalize; } code { color:var(--mudo); font-size:13px; } audio { width:100%; height:34px; }
  .vazio { color:var(--mudo); font-size:13px; }
</style></head><body>
<h1>EMOÇÕES DA VOZ</h1>
<p class="sub" id="sub">Carregando...</p>
<div id="lista"></div>
<script>
fetch('/api/emocoes').then((r) => r.json()).then((d) => {
  document.getElementById('sub').textContent = 'Voz ' + d.voz + ' · modelo ' + d.modelo + '. O Jarvis escolhe a emoção de cada frase sozinho; aqui você confere de ouvido como cada uma soa.';
  const lista = document.getElementById('lista');
  for (const e of d.emocoes) {
    const l = document.createElement('div'); l.className = 'item';
    l.innerHTML = '<b></b><code></code><div></div>';
    l.children[0].textContent = e.nome; l.children[1].textContent = e.tag || '(sem marca)';
    if (e.amostra) { const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = '/api/emocao/' + e.nome; l.children[2].appendChild(a); }
    else l.children[2].innerHTML = '<span class="vazio">sem amostra: rode scripts\\gerar_amostras_emocao.py</span>';
    lista.appendChild(l);
  }
});
</script></body></html>
